<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Chat Room</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>

    <!-- Bootstrap CSS für allgemeines Styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Link zu allgemeinem Custom CSS -->
    <link rel="stylesheet" href="/static/css/chat.css">

    <link rel="stylesheet" href="/static/css/header.css">
</head>
<body>
    <!-- Include Header hier -->
    {% include 'header.html' %}

     <h1 class="text-center">Chatroom</h1>
    <div class="container mt-5">
        <!-- Farbauswahl und Nachrichtenbereich -->
        <div class="d-flex justify-content-between mb-3">
            <input type="color" id="colorPicker" value="{{ current_user.color }}" class="form-control" style="width: 50px;">
        </div>

        <div id="messages" class="mb-4"></div>

        <div class="input-group">
            <input id="message_input" type="text" placeholder="Nachricht eingeben..." autocomplete="off" class="form-control">
            <button id="send_button" class="btn btn-primary">Senden</button>
        </div>

        <p id="reply_info" class="mt-2" style="font-size: 12px; color: gray;"></p>

        <div id="popupMenu" class="popup-menu"></div>
    </div>

    <script>
        const socket = io();
        const username = "{{ current_user.username }}"; // Benutzernamen von Flask abrufen

        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message_input');
        const sendButton = document.getElementById('send_button');
        const colorPicker = document.getElementById('colorPicker');
        const replyInfo = document.getElementById('reply_info');
        const popupMenu = document.getElementById('popupMenu');

        let mutedUsers = [];  // Liste der stummgeschalteten Benutzer
        let replyingTo = null;  // Antwort auf eine Nachricht

        function sendMessage() {
            const message = messageInput.value;
            const color = colorPicker.value;

            if (message) {
                socket.emit('send_message', {
                    msg: message,
                    username: username,
                    color: color,
                    replyTo: replyingTo
                });

                replyingTo = null;
                replyInfo.textContent = '';
                messageInput.value = '';
            }
        }

        sendButton.onclick = function() {
            sendMessage();
        };

        messageInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        });

        function setReplyToMessage(messageText) {
            replyingTo = messageText;
            replyInfo.innerHTML = `Antworten auf: "${messageText}" <span onclick="clearReply()" style="color: red; cursor: pointer;">X</span>`;
        }

        function clearReply() {
            replyingTo = null;
            replyInfo.textContent = '';
        }

        function toggleMuteUser(username) {
            if (mutedUsers.includes(username)) {
                mutedUsers = mutedUsers.filter(user => user !== username);
                alert(`${username} wurde entstummt.`);
            } else {
                mutedUsers.push(username);
                alert(`${username} wurde stummgeschaltet.`);
            }
            closePopup();
        }

        function closePopup() {
            popupMenu.style.display = 'none';
        }

     socket.on('receive_message', function(data) {
    const messageElement = document.createElement('div');
    messageElement.classList.add('message', 'position-relative', 'mb-3', 'p-2', 'rounded', 'shadow-sm', 'bg-light');

    const profileImageUrl = data.profile_image
        ? `/static/profile_pics/${data.profile_image}`
        : '/static/profile_pics/default_profile_image.png';

    messageElement.innerHTML = `
        <div class="profile-container d-flex align-items-center mb-2">
            <img src="${profileImageUrl}" alt="${data.username}'s Profilbild" class="profile-image me-2">
            <span class="username" style="color: ${data.color}">${data.username}</span>
        </div>
        ${data.replyTo ? `<div class="reply text-muted mb-2">Antwort auf: ${data.replyTo}</div>` : ''}
        <p class="message-text mb-2">${data.msg}</p>
        <span class="time text-muted small">${data.time}</span>
        <button class="reply-button btn btn-outline-secondary btn-sm position-absolute end-0 top-50 translate-middle-y me-2">
            &#8592; Antworten
        </button>
    `;

    const replyButton = messageElement.querySelector('.reply-button');
    replyButton.onclick = function(event) {
        event.stopPropagation();
        setReplyToMessage(data.msg);
    };

    messagesDiv.appendChild(messageElement);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
});
        function showPopup(event, username) {
            const x = event.clientX;
            const y = event.clientY;
            popupMenu.style.display = 'block';
            popupMenu.style.left = `${x}px`;
            popupMenu.style.top = `${y}px`;

            popupMenu.innerHTML = `
                <button onclick="toggleMuteUser('${username}')">Stummschalten/Entstummschalten</button>
            `;
        }

        function showEmojiPicker(event, messageId) {
            currentMessageId = messageId;
            emojiPicker.togglePicker(event.target);
        }

        emojiPicker.on('emoji', emoji => {
            socket.emit('react_message', {
                message_id: currentMessageId,
                emoji: emoji,
                username: username
            });
        });

        socket.on('react_message', function(data) {
            const messageElement = document.querySelector(`.message[data-id="${data.message_id}"]`);
            if (messageElement) {
                const reactionsDiv = messageElement.querySelector('.reactions');
                reactionsDiv.innerHTML += ` ${data.emoji}`;
            }
        });
    </script>
</body>
</html>
