<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Chat Room</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/chat.css">
    <link rel="stylesheet" href="/static/css/header.css">

    <style>
        .reaction-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            margin-right: 5px;
        }

        .reaction-display {
            margin-top: 5px;
            font-size: 16px;
        }

        .message {
            position: relative;
            animation: fadeSlideIn 0.3s ease-in-out;
        }

        .reaction-icon-trigger {
            display: none;
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        .message:hover .reaction-icon-trigger {
            display: inline;
        }

        .reaction-menu {
            display: none;
            position: absolute;
            top: 35px;
            left: 10px;
            background: #fff;
            border: 1px solid #ccc;
            padding: 5px 8px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            z-index: 10;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    {% include 'header.html' %}
    <h1 class="text-center">Chatroom</h1>

    <div class="container mt-5">
        <div id="messages" class="mb-4"></div>

        <div id="reply_info" class="mb-2 p-2 rounded bg-light border d-none">
            <span id="reply_text" class="text-muted"></span>
            <button onclick="clearReply()" class="btn-close float-end" aria-label="Schließen"></button>
        </div>

        <div class="input-group">
            <input id="message_input" type="text" placeholder="Nachricht eingeben..." autocomplete="off" class="form-control">
            <button id="send_button" class="btn btn-primary">Senden</button>
        </div>

        <div id="popupMenu" class="popup-menu"></div>
    </div>

    <script>
        const socket = io();
        const username = "{{ current_user.username }}";
        const userColor = "{{ current_user.color }}";
        const isAdmin = {{ current_user.is_admin() | lower }};

        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message_input');
        const sendButton = document.getElementById('send_button');
        const replyInfo = document.getElementById('reply_info');
        const replyText = document.getElementById('reply_text');
        const popupMenu = document.getElementById('popupMenu');

        let replyingTo = null;

        function sendMessage() {
            const message = messageInput.value;
            if (message) {
                socket.emit('send_message', {
                    msg: message,
                    username: username,
                    color: userColor,
                    replyTo: replyingTo,
                    user_id: {{ current_user.id }}
                });
                clearReply();
                messageInput.value = '';
            }
        }

        sendButton.onclick = sendMessage;
        messageInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        });

        function setReplyToMessage(messageText) {
            replyingTo = messageText;
            replyText.textContent = `Antwort auf: "${messageText}"`;
            replyInfo.classList.remove('d-none');
        }

        function clearReply() {
            replyingTo = null;
            replyInfo.classList.add('d-none');
        }

        socket.on('receive_message', function(data) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', 'position-relative', 'mb-3', 'p-2', 'rounded', 'shadow-sm', 'bg-light');
            messageElement.setAttribute('data-message-id', data.message_id);

            const profileImageUrl = data.profile_image && data.profile_image !== "null"
                ? `/static/${data.profile_image}`
                : '/static/profile_pics/default_profile_image.png';

            messageElement.innerHTML = `
                <div class="profile-container d-flex align-items-center mb-2">
                    <img src="${profileImageUrl}" 
                         alt="${data.username}'s Profilbild" 
                         class="profile-image me-2"
                         onclick="startPrivateChat('${data.username}', ${data.user_id})" 
                         style="cursor: pointer;"
                         onerror="this.src='/static/profile_pics/default_profile_image.png'">
                    <span class="username" style="color: ${data.color}" 
                          onclick="startPrivateChat('${data.username}', ${data.user_id})">
                        ${data.username}
                    </span>
                </div>
                ${data.replyTo ? `<div class="reply text-muted mb-2">Antwort auf: ${data.replyTo}</div>` : ''}
                <p class="message-text mb-2">${data.msg}</p>
                <span class="time text-muted small">${data.time}</span>
                <button class="reply-button btn btn-outline-secondary btn-sm position-absolute end-0 top-50 translate-middle-y me-2">&#8592; Antworten</button>
                ${isAdmin ? `<button class="delete-button btn btn-danger btn-sm position-absolute" style="right: 10px; bottom: 20px; transform: translateY(50%);">&#10060; Löschen</button>` : ''}

                <div class="reaction-icon-trigger" onclick="toggleReactionMenu('${data.message_id}')">💬</div>
                <div class="reaction-menu" id="reaction-menu-${data.message_id}">
                    <button class="reaction-btn" onclick="addReaction(this, '${data.message_id}', '😭')">😭</button>
                    <button class="reaction-btn" onclick="addReaction(this, '${data.message_id}', '😄')">😄</button>
                    <button class="reaction-btn" onclick="addReaction(this, '${data.message_id}', '☠')">☠</button>
                    <button class="reaction-btn" onclick="addReaction(this, '${data.message_id}', '🙏')">🙏</button>
                </div>
                <div class="reaction-display" id="reactions-${data.message_id}"></div>
            `;

            if (isAdmin) {
                const deleteButton = messageElement.querySelector('.delete-button');
                deleteButton.onclick = function(event) {
                    event.stopPropagation();
                    socket.emit('delete_message', { message_id: data.message_id });
                };
            }

            const replyButton = messageElement.querySelector('.reply-button');
            replyButton.onclick = function(event) {
                event.stopPropagation();
                setReplyToMessage(data.msg);
            };

            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        socket.on('message_deleted', function(data) {
            const messageId = data.message_id;
            const messageElement = document.querySelector(`[data-message-id='${messageId}']`);
            if (messageElement) {
                messageElement.remove();
            }
        });

        socket.on('banned_message', function(data) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-danger alert-dismissible fade show mt-3';
            alertDiv.role = 'alert';
            alertDiv.innerHTML = `
                <strong>Gesperrt!</strong> ${data.message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Schließen"></button>
            `;
            document.querySelector('.container').appendChild(alertDiv);
            setTimeout(() => {
                alertDiv.classList.remove('show');
                setTimeout(() => alertDiv.remove(), 150);
            }, 5000);
        });

        const userReactions = new Set();

        function toggleReactionMenu(messageId) {
            const menu = document.getElementById('reaction-menu-' + messageId);
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function addReaction(button, messageId, emoji) {
            // Socket.IO Event senden, um die Reaktion an alle Clients weiterzuleiten
            socket.emit('react_message', {
                message_id: messageId,
                emoji: emoji,
                username: username
            });
            
            // Menü schließen nachdem die Reaktion gesendet wurde
            toggleReactionMenu(messageId);
        }

        function startPrivateChat(username, userId) {
            console.log("startPrivateChat aufgerufen:", username, userId);
            
            // Fehlerbehandlung für fehlende userId
            if (!userId || userId === "undefined" || userId === undefined) {
                // User-ID anhand des Benutzernamens nachschlagen
                fetch(`/chat/get_user_id_by_name/${encodeURIComponent(username)}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.user_id) {
                            window.location.href = `/chat/private/${data.user_id}`;
                        } else {
                            alert(`Kann keinen privaten Chat mit ${username} starten: Benutzer nicht gefunden.`);
                        }
                    })
                    .catch(error => {
                        console.error("Fehler beim Abrufen der User-ID:", error);
                        alert("Fehler beim Starten des privaten Chats. Bitte versuche es später erneut.");
                    });
            } else {
                // Normal weiterleiten wenn userId vorhanden ist
                window.location.href = `/chat/private/${userId}`;
            }
        }

        socket.on('react_message', function(data) {
            const { message_id, emoji, username } = data;
            const container = document.getElementById('reactions-' + message_id);
            
            if (!container) return; // Falls die Nachricht nicht gefunden wird
            
            // Prüfen, ob es bereits eine Reaktion mit diesem Emoji gibt
            let span = container.querySelector(`span[data-emoji='${emoji}']`);
            
            if (span) {
                // Reaktion existiert bereits, Zähler erhöhen
                let count = parseInt(span.getAttribute('data-count')) + 1;
                span.setAttribute('data-count', count);
                span.innerText = emoji + ' ' + count;
            } else {
                // Neue Reaktion hinzufügen
                span = document.createElement('span');
                span.setAttribute('data-emoji', emoji);
                span.setAttribute('data-count', 1);
                span.style.marginRight = '10px';
                span.innerText = emoji + ' 1';
                container.appendChild(span);
            }
        });
    </script>
</body>
</html>
