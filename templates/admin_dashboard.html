<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            padding: 8px;
            border: 1px solid #ccc;
        }
        form {
            display: inline;
        }
        button {
            margin-top: 4px;
        }
    </style>
</head>
<body>
    {% include 'header.html' %}

    <h2>Admin-Dashboard</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Rolle</th>
            <th>Gebannt?</th>
            <th>Aktionen</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>

            <td>
                <form method="POST" action="{{ url_for('admin.change_username', user_id=user.id) }}">
                    <input name="username" value="{{ user.username }}">
                    <button type="submit">Ändern</button>
                </form>
            </td>

            <td>
                <form method="POST" action="{{ url_for('admin.change_role', user_id=user.id) }}">
                    <select name="role">
                        <option value="user" {% if user.role == 'user' %}selected{% endif %}>User</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                    <button type="submit">Ändern</button>
                </form>
            </td>

            <td>
                <form method="POST" action="{{ url_for('admin.toggle_ban', user_id=user.id) }}">
                    <input type="hidden" name="is_banned" value="{{ 'false' if user.is_banned else 'true' }}">
                    <button type="submit">
                        {{ 'Entsperren' if user.is_banned else 'Sperren' }}
                    </button>
                </form>
            </td>

            <td>
                <form method="POST" action="{{ url_for('admin.delete_user', user_id=user.id) }}" onsubmit="return confirm('Bist du sicher, dass du diesen Benutzer löschen willst?');">
                    <button type="submit">Löschen</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
