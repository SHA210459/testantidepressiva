<!-- admin_dashboard.html -->
{% extends "header.html" %}

{% block content %}
    <main class="container my-5">
        <h1 class="text-center mb-4 animate__animated animate__fadeInUp">Admin Dashboard</h1>

        <!-- Tabelle für Benutzer -->
        <section class="users-section">
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover">
                    <thead class="thead-dark">
                        <tr>
                            <th>Benutzername</th>
                            <th>Rolle</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                            <tr>
                                <td>{{ user.username }}</td>
                                <td>{{ user.role }}</td>
                                <td>
                                    <!-- Rolle ändern Formular -->
                                    <form method="POST" action="{{ url_for('admin.change_role', user_id=user.id) }}" class="d-inline">
                                        <div class="input-group">
                                            <select name="role" class="form-select" style="width: auto;">
                                                <option value="user" {% if user.role == 'user' %}selected{% endif %}>Benutzer</option>
                                                <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                                            </select>
                                            <button type="submit" class="btn btn-warning btn-sm ml-2">Ändern</button>
                                        </div>
                                    </form>

                                    <!-- Benutzer löschen Formular -->
                                    <form method="POST" action="{{ url_for('admin.delete_user', user_id=user.id) }}" class="d-inline">
                                        <button type="submit" class="btn btn-danger btn-sm ml-2">Löschen</button>
                                    </form>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>
    </main>

{% endblock %}
