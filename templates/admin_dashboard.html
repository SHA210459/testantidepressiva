<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4f9fd;
            font-family: 'Open Sans', sans-serif;
            color: #333;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2c73d2;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
        }

        th {
            background-color: #e8f0fe;
            color: #2c73d2;
            font-weight: 600;
        }

        td, th {
            padding: 12px;
            vertical-align: middle;
        }

        input, select {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 6px;
            width: 100%;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        .btn-ban {
            background-color: #f39c12;
            color: white;
        }

        .btn-ban:hover {
            background-color: #d68910;
        }

        .form-inline {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .form-inline {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    {% include 'header.html' %}

    <div class="dashboard-container">
        <h2>Admin-Dashboard</h2>
        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Rolle</th>
                        <th>Gebannt?</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.id }}</td>

                        <td>
                            <form method="POST" action="{{ url_for('admin.change_username', user_id=user.id) }}" class="form-inline">
                                <input name="username" type="text" value="{{ user.username }}">
                                <button type="submit" class="btn btn-primary btn-sm">Ändern</button>
                            </form>
                        </td>

                        <td>
                            <form method="POST" action="{{ url_for('admin.change_role', user_id=user.id) }}" class="form-inline">
                                <select name="role">
                                    <option value="user" {% if user.role == 'user' %}selected{% endif %}>User</option>
                                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                                </select>
                                <button type="submit" class="btn btn-primary btn-sm">Ändern</button>
                            </form>
                        </td>

                        <td>
                            <form method="POST" action="{{ url_for('admin.toggle_ban', user_id=user.id) }}">
                                <input type="hidden" name="is_banned" value="{{ 'false' if user.is_banned else 'true' }}">
                                <button type="submit" class="btn btn-sm btn-ban">
                                    {{ 'Entsperren' if user.is_banned else 'Sperren' }}
                                </button>
                            </form>
                        </td>

                        <td>
                            <form method="POST" action="{{ url_for('admin.delete_user', user_id=user.id) }}" onsubmit="return confirm('Bist du sicher, dass du diesen Benutzer löschen willst?');">
                                <button type="submit" class="btn btn-sm btn-delete">Löschen</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
