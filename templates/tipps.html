<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antidepressiva Tipps</title>

    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/header.css">

</head>
<body>
    {% include 'header.html' %}

    <main class="container my-5">
        <h1 class="text-center mb-4">Tipps gegen Depressionen</h1>

        <!-- Tipps anzeigen -->
        <div class="row g-4">
            {% for tipp in tipps %}
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <!-- Hier wird die Überschrift angezeigt -->
<h5 class="card-text">{{ tipp['ueberschrift'] }}</h5>
                            <p class="card-text">{{ tipp['text'] }}</p>
                            <p class="text-muted small">Erstellt am: {{ tipp['created_at'] }}</p>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-light text-center py-3 shadow-lg">
        <p class="mb-0">© 2024 Antidepressiva Chatroom. Alle Rechte vorbehalten.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
