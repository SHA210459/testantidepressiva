<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private Chats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <style>
        .chat-container {
            max-width: 1200px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .chat-list {
            background-color: #f8f9fa;
            height: 600px;
            overflow-y: auto;
            position: relative;
        }
        .chat-messages {
            background-color: #ffffff;
            height: 600px;
            overflow-y: hidden;
            padding: 0;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
        }
        .chat-item:hover {
            background-color: #e9ecef;
        }
        .chat-item.active {
            background-color: #d1e7ff;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }
        .message-input {
            padding: 15px;
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }
        .messages-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 70%;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .received {
            background-color: #e9ecef;
            margin-right: auto;
        }
        .sent {
            background-color: #007bff;
            color: white;
            margin-left: auto;
        }
        .time-stamp {
            font-size: 0.8em;
            color: #6c757d;
            margin-top: 5px;
        }
        .unread-badge {
            background-color: #dc3545;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
        }
        .add-chat-button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        #no-chat-selected {
            padding: 50px;
        }
        .user-popup {
            position: absolute;
            top: 60px;
            right: 10px;
            background-color: white;
            width: 260px;
            max-height: 400px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            padding: 10px;
            z-index: 999;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }
        .popup-user-list {
            max-height: 320px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
{% include 'header.html' %}
<div class="container mt-5">
    <h2 class="mb-4"><i class="fas fa-comments me-2"></i>Private Chats</h2>
    <div class="chat-container">
        <div class="row g-0">
            <div class="col-md-4 chat-list">
                <div class="d-flex align-items-center p-3 border-bottom position-relative">
                    <input type="text" class="form-control" placeholder="Chat suchen..." id="chat-search" autocomplete="off" />
                    <button class="add-chat-button ms-2" id="add-chat" title="Neuen Chat starten"><i class="fas fa-plus"></i></button>
                    <div id="user-popup" class="user-popup d-none">
                        <input type="text" class="form-control mb-2" placeholder="User suchen..." id="popup-user-search" />
                        <div id="popup-user-list" class="popup-user-list"></div>
                    </div>
                </div>
                <div id="chat-list-container" class="p-2">
                    {% for partner in chat_partners %}
                    <div class="chat-item" data-partner-id="{{ partner.id }}" data-username="{{ partner.username }}">
                        <img src="{{ partner.profile_image if partner.profile_image else url_for('static', filename='img/default-profile.png') }}" class="user-avatar" alt="{{ partner.username }}" />
                        <div class="d-flex flex-grow-1 align-items-center">
                            <div>
                                <h6 class="mb-1">{{ partner.username }}</h6>
                                <p class="text-muted small mb-0 last-message-preview">Letzte Nachricht...</p>
                            </div>
                            <div class="unread-badge d-none">0</div>
                        </div>
                    </div>
                    {% else %}
                    <div class="text-center p-5 text-muted">
                        <i class="fas fa-comment-slash fa-3x mb-3"></i>
                        <p>Noch keine privaten Chats vorhanden</p>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="col-md-8 chat-messages d-flex flex-column">
                <div class="text-center text-muted" id="no-chat-selected">
                    <i class="fas fa-comment-dots fa-3x mb-3"></i>
                    <h4>Wähle einen Chat aus</h4>
                    <p>Wähle einen Kontakt aus, um die Nachrichten anzuzeigen</p>
                </div>
                <div id="chat-display" class="d-none flex-column flex-grow-1">
                    <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
                        <div class="d-flex align-items-center">
                            <img id="current-partner-avatar" class="user-avatar" src="" alt="Chatpartner" />
                            <h5 class="mb-0 ms-3" id="current-partner-name"></h5>
                        </div>
                        <button class="btn btn-sm btn-outline-danger" id="delete-chat" title="Chat löschen">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <div class="messages-content flex-grow-1" id="messages-container"></div>
                    <div class="message-input">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Nachricht schreiben..." id="message-input" autocomplete="off" />
                            <button class="btn btn-primary" type="button" id="send-button" title="Nachricht senden">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const addChatBtn = document.getElementById('add-chat');
    const userPopup = document.getElementById('user-popup');
    const popupSearch = document.getElementById('popup-user-search');
    const popupUserList = document.getElementById('popup-user-list');

    async function loadAllUsers() {
        try {
            const response = await fetch('/chat/all_users');
            const users = await response.json();
            popupUserList.innerHTML = '';

            users.forEach(user => {
                const userDiv = document.createElement('div');
                userDiv.className = 'chat-item new-chat-user';
                userDiv.dataset.userId = user.id;
                userDiv.dataset.username = user.username;
                userDiv.innerHTML = `
                    <img src="${user.profile_image || '/static/img/default-profile.png'}" class="user-avatar" alt="${user.username}" />
                    <div><h6 class="mb-0">${user.username}</h6></div>
                `;
                userDiv.addEventListener('click', () => startChat(user.id));
                popupUserList.appendChild(userDiv);
            });
        } catch (err) {
            console.error('Fehler beim Laden der Benutzer:', err);
        }
    }

    addChatBtn.addEventListener('click', () => {
        userPopup.classList.toggle('d-none');
        popupSearch.value = '';
        loadAllUsers();
    });

    popupSearch.addEventListener('input', () => {
        const term = popupSearch.value.toLowerCase();
        document.querySelectorAll('#popup-user-list .new-chat-user').forEach(item => {
            const username = item.dataset.username.toLowerCase();
            item.style.display = username.includes(term) ? 'flex' : 'none';
        });
    });

    document.addEventListener('click', (event) => {
        if (!addChatBtn.contains(event.target) && !userPopup.contains(event.target)) {
            userPopup.classList.add('d-none');
        }
    });

    async function startChat(userId) {
        try {
            const response = await fetch(`/chat/start_chat/${userId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            });
            if (response.ok) {
                location.reload();
            } else {
                throw new Error('Chat konnte nicht erstellt werden');
            }
        } catch (err) {
            alert('Fehler beim Erstellen des Chats.');
            console.error(err);
        }
    }
});
</script>
</body>
</html>
