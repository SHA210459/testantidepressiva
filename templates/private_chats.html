<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chats</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome f체r Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Eigenes CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .chat-container {
            max-width: 1200px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .chat-list {
            background-color: #f8f9fa;
            height: 600px;
            overflow-y: auto;
        }
        .chat-messages {
            background-color: #ffffff;
            height: 600px;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }
        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .chat-item:hover {
            background-color: #e9ecef;
        }
        .chat-item.active {
            background-color: #d1e7ff;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }
        .message-input {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 70%;
        }
        .received {
            background-color: #e9ecef;
            margin-right: auto;
        }
        .sent {
            background-color: #007bff;
            color: white;
            margin-left: auto;
        }
        .time-stamp {
            font-size: 0.8em;
            color: #6c757d;
            margin-top: 5px;
        }
        .unread-badge {
            background-color: #dc3545;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
        }
        .color-swatch {
            width: 25px;
            height: 25px;
            margin: 2px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .emoji-picker {
            position: absolute;
            bottom: 60px;
            background-color: white;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .emoji-container {
            display: flex;
            flex-wrap: wrap;
            max-width: 300px;
        }
        
        .emoji {
            font-size: 20px;
            padding: 5px;
            cursor: pointer;
        }
        
        .emoji:hover {
            background-color: #e9ecef;
            border-radius: 5px;
        }
        
        .message-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }
        
        .reaction {
            background-color: #e9ecef;
            border-radius: 15px;
            padding: 2px 6px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .formatted-message img.emoji {
            height: 1.2em;
            width: 1.2em;
            margin: 0 .05em 0 .1em;
            vertical-align: -0.1em;
        }
    </style>
</head>
<body>
    <!-- Header einbinden -->
    {% include 'header.html' %}

    <div class="container mt-5">
        <h2 class="mb-4"><i class="fas fa-comments me-2"></i>Private Chats</h2>

        <div class="chat-container">
            <div class="row g-0">
                <!-- Chat-Liste -->
                <div class="col-md-4 chat-list">
                    <div class="d-flex align-items-center p-3 border-bottom">
                        <input type="text" class="form-control" placeholder="Chat suchen..." id="chat-search">
                    </div>

                    {% for partner in chat_partners %}
                    <div class="chat-item d-flex align-items-center" data-partner-id="{{ partner.id }}" data-username="{{ partner.username }}">
                        <img src="{{ url_for('static', filename=partner.profile_image) }}" 
                             class="user-avatar"
                             alt="{{ partner.username }}"
                             onerror="this.src='{{ url_for('static', filename='profile_pics/default_profile_image.png') }}'">
                        <div class="d-flex flex-grow-1 align-items-center">
                            <div>
                                <h6 class="mb-1">{{ partner.username }}</h6>
                                <p class="text-muted small mb-0 last-message-preview">Letzte Nachricht...</p>
                            </div>
                            <div class="unread-badge d-none">0</div>
                        </div>
                    </div>
                    {% else %}
                    <div class="text-center p-5 text-muted">
                        <i class="fas fa-comment-slash fa-3x mb-3"></i>
                        <p>Noch keine privaten Chats vorhanden</p>
                    </div>
                    {% endfor %}
                </div>

                <!-- Chat-Nachrichten -->
                <div class="col-md-8 chat-messages">
                    <div class="text-center text-muted p-5" id="no-chat-selected">
                        <i class="fas fa-comment-dots fa-3x mb-3"></i>
                        <h4>Wähle einen Chat aus</h4>
                        <p>Wähle einen Kontakt aus, um die Nachrichten anzuzeigen</p>
                    </div>

                    <div id="chat-display" class="d-none">
                        <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
                            <div class="d-flex align-items-center">
                                <img id="current-partner-avatar" class="user-avatar" src="">
                                <h5 class="mb-0 ms-3" id="current-partner-name"></h5>
                            </div>
                            <button class="btn btn-sm btn-outline-danger" id="delete-chat">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        <div class="messages-content" style="height: 450px; overflow-y: auto; padding: 15px;" id="messages-container">
                            <!-- Nachrichten werden hier dynamisch eingef체gt -->
                        </div>
                    </div>

                    <div class="message-input d-none" id="message-input-area">
                        <div class="formatting-controls mb-2">
                            <button class="btn btn-sm btn-outline-secondary" onclick="formatText('bold')">
                                <i class="fas fa-bold"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="formatText('italic')">
                                <i class="fas fa-italic"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="formatText('underline')">
                                <i class="fas fa-underline"></i>
                            </button>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                                    <i class="fas fa-palette"></i>
                                </button>
                                <div class="dropdown-menu p-2 color-picker">
                                    <div class="d-flex flex-wrap" style="width: 150px;">
                                        <div class="color-swatch" style="background-color: #000000;" onclick="setTextColor('#000000')"></div>
                                        <div class="color-swatch" style="background-color: #ff0000;" onclick="setTextColor('#ff0000')"></div>
                                        <div class="color-swatch" style="background-color: #0000ff;" onclick="setTextColor('#0000ff')"></div>
                                        <div class="color-swatch" style="background-color: #008000;" onclick="setTextColor('#008000')"></div>
                                        <div class="color-swatch" style="background-color: #ffa500;" onclick="setTextColor('#ffa500')"></div>
                                        <div class="color-swatch" style="background-color: #800080;" onclick="setTextColor('#800080')"></div>
                                    </div>
                                </div>
                            </div>
                            <button class="btn btn-sm btn-outline-secondary" onclick="showEmojiPicker()">
                                <i class="far fa-smile"></i>
                            </button>
                        </div>
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Nachricht schreiben..." id="message-input">
                            <button class="btn btn-primary" type="button" id="send-button">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                        <div id="emoji-picker" class="emoji-picker d-none">
                            <div class="emoji-container">
                              <span class="emoji" onclick="insertEmoji('😂')">😂</span>
<span class="emoji" onclick="insertEmoji('🐱')">🐱</span>
<span class="emoji" onclick="insertEmoji('🚀')">🚀</span>
<span class="emoji" onclick="insertEmoji('🌈')">🌈</span>
<span class="emoji" onclick="insertEmoji('🍕')">🍕</span>
<span class="emoji" onclick="insertEmoji('🔥')">🔥</span>
<span class="emoji" onclick="insertEmoji('🎉')">🎉</span>
<span class="emoji" onclick="insertEmoji('💡')">💡</span>
<span class="emoji" onclick="insertEmoji('😎')">😎</span>
<span class="emoji" onclick="insertEmoji('🧠')">🧠</span>
<span class="emoji" onclick="insertEmoji('🎵')">🎵</span>
<span class="emoji" onclick="insertEmoji('🐶')">🐶</span>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle mit Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        socket.on('connect', function() {
          console.log('Socket.IO verbunden!');
        });

        socket.on('connect_error', function(error) {
          console.error('Socket.IO Verbindungsfehler:', error);
        });

        document.addEventListener('DOMContentLoaded', function() {
            let currentPartnerId = null;
            let currentPartnerUsername = null;
            let currentPartnerAvatar = null;

            // Automatisch Chat ausw채hlen, wenn Partner-ID vorhanden ist
            const urlParams = new URLSearchParams(window.location.search);
            const partnerIdParam = urlParams.get('partner_id');
            if (partnerIdParam) {
                // Partner-Element suchen und Klick simulieren
                const partnerItem = document.querySelector(`.chat-item[data-partner-id="${partnerIdParam}"]`);
                if (partnerItem) {
                    partnerItem.click();
                } else {
                    // Wenn Partner nicht in der Liste ist, aber 체ber URL aufgerufen wurde
                    fetch(`/chat/get_user/${partnerIdParam}`)
                        .then(response => response.json())
                        .then(partner => {
                            currentPartnerId = partner.id;
                            currentPartnerUsername = partner.username;
                            currentPartnerAvatar = partner.profile_image || '/static/profile_pics/default_profile_image.png';
                            
                            // Chat anzeigen
                            document.getElementById('no-chat-selected').classList.add('d-none');
                            document.getElementById('chat-display').classList.remove('d-none');
                            document.getElementById('message-input-area').classList.remove('d-none');

                            document.getElementById('current-partner-name').textContent = currentPartnerUsername;
                            document.getElementById('current-partner-avatar').src = 
    currentPartnerAvatar.includes('/static/') ? 
    currentPartnerAvatar : 
    `/static/${currentPartnerAvatar}`.replace('/static/static/', '/static/');
                            
                            // Nachrichten laden
                            loadMessages(currentPartnerId);
                        });
                }
            }

            // Chat-Suche
            document.getElementById('chat-search').addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                document.querySelectorAll('.chat-item').forEach(item => {
                    const username = item.dataset.username.toLowerCase();
                    if (username.includes(searchTerm)) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });

            // Chat-Partner ausw채hlen
            document.querySelectorAll('.chat-item').forEach(item => {
                item.addEventListener('click', function() {
                    currentPartnerId = this.dataset.partnerId;
                    currentPartnerUsername = this.dataset.username;
                    currentPartnerAvatar = this.querySelector('img').src;

                    // UI aktualisieren
                    document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');

                    // Chat anzeigen
                    document.getElementById('no-chat-selected').classList.add('d-none');
                    document.getElementById('chat-display').classList.remove('d-none');
                    document.getElementById('message-input-area').classList.remove('d-none');

                    document.getElementById('current-partner-name').textContent = currentPartnerUsername;
                    document.getElementById('current-partner-avatar').src = currentPartnerAvatar;
if (currentPartnerAvatar) {
    // URL korrigieren - doppelte Static-Pfade entfernen
    let fixedUrl = currentPartnerAvatar;
    if (fixedUrl.includes('http://localhost:5000/static/')) {
        // Entferne den doppelten URL-Teil
        fixedUrl = fixedUrl.replace('http://localhost:5000/static/', '/static/');
    } else if (!fixedUrl.startsWith('/static/') && !fixedUrl.startsWith('http')) {
        // Füge /static/ hinzu, wenn es fehlt und keine vollständige URL ist
        fixedUrl = '/static/' + fixedUrl;
    }
    document.getElementById('current-partner-avatar').src = fixedUrl;
}

                    // Nachrichten laden
                    loadMessages(currentPartnerId);

                    // Ungelesene Nachrichten zur체cksetzen
                    const unreadBadge = this.querySelector('.unread-badge');
                    unreadBadge.classList.add('d-none');
                    unreadBadge.textContent = '0';
                });
            });

            // Textformatierungsfunktionen
            function formatText(style) {
                const input = document.getElementById('message-input');
                const selectedText = getSelectedText(input);
                let replacement = '';
                
                if (selectedText) {
                    switch (style) {
                        case 'bold':
                            replacement = `<strong>${selectedText}</strong>`;
                            break;
                        case 'italic':
                            replacement = `<em>${selectedText}</em>`;
                            break;
                        case 'underline':
                            replacement = `<u>${selectedText}</u>`;
                            break;
                    }
                    
                    replaceSelectedText(input, replacement);
                }
            }
            
            function setTextColor(color) {
                const input = document.getElementById('message-input');
                const selectedText = getSelectedText(input);
                
                if (selectedText) {
                    const replacement = `<span style="color:${color}">${selectedText}</span>`;
                    replaceSelectedText(input, replacement);
                }
            }
            
            function getSelectedText(input) {
                if (input.selectionStart !== undefined) {
                    return input.value.substring(input.selectionStart, input.selectionEnd);
                }
                return '';
            }
            
            function replaceSelectedText(input, replacement) {
                if (input.selectionStart !== undefined) {
                    const startPos = input.selectionStart;
                    const endPos = input.selectionEnd;
                    input.value = input.value.substring(0, startPos) + replacement + input.value.substring(endPos);
                    input.focus();
                    input.selectionStart = startPos + replacement.length;
                    input.selectionEnd = startPos + replacement.length;
                }
            }
            
            function showEmojiPicker() {
                const emojiPicker = document.getElementById('emoji-picker');
                emojiPicker.classList.toggle('d-none');
            }
            
            function insertEmoji(emoji) {
                const input = document.getElementById('message-input');
                const startPos = input.selectionStart || 0;
                input.value = input.value.substring(0, startPos) + emoji + input.value.substring(startPos);
                input.focus();
                input.selectionStart = startPos + emoji.length;
                input.selectionEnd = startPos + emoji.length;
                document.getElementById('emoji-picker').classList.add('d-none');
            }
            
            // Nachrichten laden
            async function loadMessages(partnerId) {
                try {
                    const response = await fetch(`/chat/get_messages/${partnerId}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const messages = await response.json();
                    console.log("Geladene Nachrichten:", messages);
                    
                    // Messages-Container leeren und neu befüllen
                    const messagesContainer = document.getElementById('messages-container');
                    messagesContainer.innerHTML = '';
                    
                    // Nachrichten anzeigen
                    messages.forEach(msg => {
                        const isSent = msg.sender_id == {{ current_user.id }};
                        const messageDiv = document.createElement('div');
                        messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
                        messageDiv.dataset.messageId = msg.id;
                        
                        messageDiv.innerHTML = `
                            <div class="message-content">
                                ${msg.message}
                            </div>
                            <div class="time-stamp">${msg.timestamp}</div>
                        `;
                        
                        messagesContainer.appendChild(messageDiv);
                    });
                    
                    scrollToBottom();
                } catch (error) {
                    console.error("Fehler beim Laden der Nachrichten:", error);
                }
            }
            
            // Nachricht senden
            document.getElementById('send-button').addEventListener('click', sendMessage);
            document.getElementById('message-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            async function sendMessage() {
                const input = document.getElementById('message-input');
                const message = input.value.trim();
                console.log("Sende Nachricht:", message, "an Partner:", currentPartnerId);
                
                if (message && currentPartnerId) {
                    try {
                        const response = await fetch('/chat/send_message', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                receiver_id: currentPartnerId,
                                message: message,
                                formatted: true // Hinweis, dass diese Nachricht Formatierungen enthalten kann
                            })
                        });

                        if (response.ok) {
                            input.value = '';
                            loadMessages(currentPartnerId);
                            
                            // Socket.io Nachricht senden
                            socket.emit('send_private_message', {
                                sender_id: '{{ current_user.id }}',
                                receiver_id: currentPartnerId,
                                message: message,
                                formatted: true
                            });
                        }
                    } catch (error) {
                        console.error('Fehler beim Senden der Nachricht:', error);
                    }
                }
            }

            // Echtzeit-Nachrichten empfangen
            socket.on('private_message', (data) => {
                if (data.sender_id == currentPartnerId) {
                    // Wenn der aktuelle Chat ge철ffnet ist, Nachricht anzeigen
                    if (currentPartnerId == data.sender_id) {
                        loadMessages(currentPartnerId);
                    } else {
                        // Ungelesene Nachrichten anzeigen
                        const chatItem = document.querySelector(`.chat-item[data-partner-id="${data.sender_id}"]`);
                        if (chatItem) {
                            const unreadBadge = chatItem.querySelector('.unread-badge');
                            unreadBadge.classList.remove('d-none');
                            unreadBadge.textContent = parseInt(unreadBadge.textContent) + 1;

                            // Letzte Nachricht aktualisieren
                            chatItem.querySelector('.last-message-preview').textContent =
                                data.message.length > 30 ? data.message.substring(0, 30) + '...' : data.message;
                        }
                    }
                }
            });

            // Reaktionen hinzuf체gen
            async function addReaction(messageId, emoji) {
                try {
                    const response = await fetch('/chat/add_reaction', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message_id: messageId,
                            emoji: emoji
                        })
                    });
                    
                    if (response.ok) {
                        // Socket.IO Ereignis, um andere Benutzer 체ber die Reaktion zu informieren
                        socket.emit('message_reaction', {
                            message_id: messageId,
                            emoji: emoji,
                            user_id: '{{ current_user.id }}'
                        });
                        
                        // Nachrichten neu laden, um die Reaktion anzuzeigen
                        loadMessages(currentPartnerId);
                    }
                } catch (error) {
                    console.error('Fehler beim Hinzuf체gen der Reaktion:', error);
                }
            }
            
            // Reaktionen anzeigen
            function showReactionPicker(messageId) {
                const picker = document.getElementById(`reaction-picker-${messageId}`);
                if (picker) {
                    picker.classList.toggle('d-none');
                }
            }

            function scrollToBottom() {
                const container = document.getElementById('messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            }

            // Chat l철schen
            document.getElementById('delete-chat').addEventListener('click', async function() {
                if (confirm(`M철chtest du den Chat mit ${currentPartnerUsername} wirklich l철schen?`)) {
                    try {
                        const response = await fetch(`/chat/delete_chat/${currentPartnerId}`, {
                            method: 'DELETE'
                        });

                        if (response.ok) {
                            location.reload(); // Seite neu laden
                        }
                    } catch (error) {
                        console.error('Fehler beim L철schen des Chats:', error);
                    }
                }
            });

            // Reaktionsereignis-Listener
            socket.on('message_reaction', (data) => {
                if (currentPartnerId) {
                    loadMessages(currentPartnerId);
                }
            });
            
            // Nachrichtenl철schereignis-Listener
            socket.on('message_deleted', (data) => {
                if (currentPartnerId) {
                    loadMessages(currentPartnerId);
                }
            });
            
            // Funktionen f체r die Verwendung in HTML im globalen Scope verf체gbar machen
            window.formatText = formatText;
            window.setTextColor = setTextColor;
            window.showEmojiPicker = showEmojiPicker;
            window.insertEmoji = insertEmoji;
            window.addReaction = addReaction;
            window.showReactionPicker = showReactionPicker;
            window.deleteMessage = deleteMessage;
        });
        
        // In das Script in private_chats.html einf체gen:
        async function deleteMessage(messageId) {
            if (confirm('M철chtest du diese Nachricht wirklich l철schen?')) {
                try {
                    const response = await fetch(`/chat/delete_message/${messageId}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        // Entferne Nachricht aus der Anzeige
                        loadMessages(currentPartnerId);
                        
                        // Informiere andere 체ber Socket.io
                        socket.emit('message_deleted', {
                            message_id: messageId
                        });
                    }
                } catch (error) {
                    console.error('Fehler beim L철schen der Nachricht:', error);
                }
            }
        }
    </script>
</body>
</html>
