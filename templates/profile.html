{% include 'header.html' %}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil bearbeiten</title>
<!-- Link to Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Link to general custom CSS -->
<link rel="stylesheet" href="/static/css/style.css">
<!-- Link to header-specific CSS -->
<link rel="stylesheet" href="/static/css/header.css">

<div class="container mt-5">
    <h1 class="text-center">Profil bearbeiten</h1>

    <!-- Flash-Meldung für Erfolg oder Fehler -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alert alert-info">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data" class="mt-4">
        <div class="mb-3">
            <label for="username" class="form-label">Benutzername:</label>
            <input type="text" id="username" name="username" value="{{ user['username'] }}" required class="form-control">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Passwort:</label>
            <input type="password" id="password" name="password" class="form-control">
        </div>

        <div class="mb-3">
            <label for="color" class="form-label">Farbe:</label>
            <!-- RGB Color Picker mit angepasster Breite -->
            <input type="color" id="color" name="color" value="{{ user['color'] }}" class="form-control" style="width: 150px;">
        </div>

        <div class="mb-3">
            <label for="profile_image" class="form-label">Profilbild:</label>
            <input type="file" id="profile_image" name="profile_image" class="form-control">
        </div>


        <input type="hidden" name="current_profile_image" value="{{ user['profile_image'] }}">

        <button type="submit" class="btn btn-primary w-100">Profil speichern</button>
    </form>
</div>

</body>
</html>
