version: '3.8'

services:
  web:
    build: .
    ports:
      - "0.0.0.0:5000:5000"  # Wichtig für Netzwerkzugriff
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=antidepressiva
    volumes:
      - ./static:/app/static

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=antidepressiva
    volumes:
      - mysql_data:/var/lib/mysql
      - ./static/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"

volumes:
  mysql_data: